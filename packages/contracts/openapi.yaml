components:
  schemas:
    Health:
      type: object
      required:
        - status
        - database
        - mode
      properties:
        status:
          type: string
          enum:
            - up
            - down
        database:
          type: string
          enum:
            - up
            - down
        mode:
          type: string
          enum:
            - local
    SongContent:
      type: object
      required:
        - schemaVersion
        - title
        - artist
        - key
        - bpm
        - meter
        - capo
        - sourceType
        - sourceReference
        - rightsBasis
        - sections
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        artist:
          type: string
          maxLength: 200
        key:
          type: string
        bpm:
          type: integer
          nullable: true
          minimum: 20
          maximum: 400
        meter:
          type: string
        capo:
          type: integer
          minimum: 0
          maximum: 12
        sourceType:
          type: string
          enum:
            - manual
            - chordpro
        sourceReference:
          type: string
          maxLength: 1000
        rightsBasis:
          type: string
          enum:
            - unspecified
            - own
            - permission
            - public_domain
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SongSection'
      additionalProperties: false
    SongSection:
      type: object
      required:
        - id
        - type
        - label
        - lines
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - intro
            - verse
            - chorus
            - bridge
            - outro
            - other
        label:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SongLine'
      additionalProperties: false
    SongLine:
      type: object
      required:
        - id
        - tokens
      properties:
        id:
          type: string
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/SongToken'
      additionalProperties: false
    SongToken:
      oneOf:
        - type: object
          required:
            - type
            - symbol
          properties:
            type:
              type: string
              enum:
                - chord
            symbol:
              type: string
            value:
              type: string
              nullable: true
          additionalProperties: false
        - type: object
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - text
            value:
              type: string
            symbol:
              type: string
              nullable: true
          additionalProperties: false
    SongSummary:
      type: object
      required:
        - id
        - title
        - artist
        - status
        - currentRevisionId
        - draftVersion
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: string
        status:
          type: string
          enum:
            - draft
            - reviewed
            - archived
        currentRevisionId:
          type: string
          format: uuid
          nullable: true
        draftVersion:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    SongRevision:
      type: object
      required:
        - id
        - revisionNo
        - content
        - source
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        revisionNo:
          type: integer
        content:
          $ref: '#/components/schemas/SongContent'
        source:
          type: string
          enum:
            - manual
            - chordpro
            - restored
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    SongDetail:
      type: object
      required:
        - song
        - draft
        - baseRevisionId
        - revisions
      properties:
        song:
          $ref: '#/components/schemas/SongSummary'
        draft:
          $ref: '#/components/schemas/SongContent'
        baseRevisionId:
          type: string
          format: uuid
          nullable: true
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/SongRevision'
      additionalProperties: false
    SongPage:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SongSummary'
        total:
          type: integer
      additionalProperties: false
    SongEdit:
      type: object
      required:
        - content
        - baseRevisionId
        - draftVersion
      properties:
        content:
          $ref: '#/components/schemas/SongContent'
        baseRevisionId:
          type: string
          format: uuid
          nullable: true
        draftVersion:
          type: integer
          format: int64
      additionalProperties: false
    SongProblem:
      type: object
      required:
        - status
        - title
        - detail
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
    BookCover:
      type: object
      required:
        - enabled
        - imageData
        - imageRights
      properties:
        enabled:
          type: boolean
        imageData:
          type: string
        imageRights:
          type: string
          enum:
            - unspecified
            - own
            - permission
      additionalProperties: false
    BookLayout:
      type: object
      required:
        - font
        - fontSize
        - marginMm
        - lineSpacing
        - columns
      properties:
        font:
          type: string
          enum:
            - sans
            - serif
        fontSize:
          type: integer
          minimum: 9
          maximum: 16
        marginMm:
          type: integer
          minimum: 10
          maximum: 25
        lineSpacing:
          type: number
          minimum: 1
          maximum: 1.6
        columns:
          type: integer
          enum:
            - 1
            - 2
      additionalProperties: false
    BookConfig:
      type: object
      required:
        - title
        - subtitle
        - organizer
        - cover
        - layout
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          type: string
          maxLength: 300
        organizer:
          type: string
          maxLength: 200
        cover:
          $ref: '#/components/schemas/BookCover'
        layout:
          $ref: '#/components/schemas/BookLayout'
      additionalProperties: false
    BookSummary:
      type: object
      required:
        - id
        - title
        - subtitle
        - archived
        - version
        - itemCount
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
        archived:
          type: boolean
        version:
          type: integer
        itemCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    BookItem:
      type: object
      required:
        - id
        - songId
        - revisionId
        - revisionNo
        - position
        - notes
        - content
        - latestRevisionId
        - songArchived
      properties:
        id:
          type: string
          format: uuid
        songId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
        position:
          type: integer
        notes:
          type: string
        content:
          $ref: '#/components/schemas/SongContent'
        latestRevisionId:
          type: string
          format: uuid
          nullable: true
        songArchived:
          type: boolean
        strummingSnapshot:
          allOf:
            - $ref: '#/components/schemas/StrummingSnapshot'
