name: Local MVP validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: strumlab_test
          POSTGRES_USER: strumlab_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U strumlab_test -d strumlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/strumlab_test
      POSTGRES_USER: strumlab_test
      POSTGRES_PASSWORD: ci-disposable-only
      LIVE_API: '1'
      LIVE_ANALYSIS: '1'
      LIVE_PLAYLISTS: '1'
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:3000/api/playlists/connection/callback
      LOCAL_API_TOKEN: ci-local-api-token-disposable-000001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --omit=dev
      - run: bash apps/api/mvnw -B -ntp -f apps/api/pom.xml verify
      - name: Build and test isolated analysis worker
        run: |
          docker build -t strumlab-analysis:ci workers/music-analysis
          docker run --rm --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 64 -e PGHOST=127.0.0.1 -e POSTGRES_DB=strumlab_test -e POSTGRES_USER -e POSTGRES_PASSWORD -e RUN_DB_TESTS=1 strumlab-analysis:ci python -m unittest -v test_analysis
      - name: Start analysis worker
        run: docker run -d --name strumlab-analysis-ci --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 64 -e PGHOST=127.0.0.1 -e POSTGRES_DB=strumlab_test -e POSTGRES_USER -e POSTGRES_PASSWORD strumlab-analysis:ci
      - name: Start API
        run: |
          bash apps/api/mvnw -B -ntp -f apps/api/pom.xml dependency:build-classpath -Dmdep.outputFile=/tmp/strumlab-test-classpath -DincludeScope=test
          java -cp "apps/api/target/test-classes:apps/api/target/classes:$(cat /tmp/strumlab-test-classpath)" br.com.strumlab.playlists.SpotifyE2EServer > /tmp/strumlab-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/strumlab-api.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: node scripts/check-guitar.mjs
      - run: npm run test:e2e
      - name: Analysis worker diagnostics and cleanup
        if: always()
        run: |
          docker logs strumlab-analysis-ci || true
          docker rm -f strumlab-analysis-ci || true
